<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; display: flex; gap: 20px; padding: 20px; font-family: sans-serif; }
.box { width: 480px; height: 505px; padding: 10px; box-sizing: border-box; }
.light { background: #FFFFFF; border: 1px solid #ccc; }
.dark { background: #121212; border: 1px solid #333; }
img { width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<div class="box light"><h3>Light Mode</h3><img src="with_pills.svg" /></div>
<div class="box dark"><h3 style="color: white;">Dark Mode</h3><img src="with_pills.svg" /></div>
</body>
</html>
